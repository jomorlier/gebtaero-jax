<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Aircraft frame a and beam frame b, top view of a swept right wing</title>
<desc>Top view. Frame a at the root: x_a forward, y_a along the right wing, z_a down into the page. Frame b on the swept reference axis: x_b along the beam outboard, y_b toward the leading edge, z_b up out of the page. Sweep measured from y_a, positive aft.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="320" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#2C2C2A">Top view — right wing, looking down (z_a into the page)</text>
<polygon points="200,140 600,240 600,290 200,260" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<line x1="200" y1="132" x2="200" y2="268" stroke="#444441" stroke-width="3"/>
<text font-size="12" fill="#5F5E5A" x="200" y="288" text-anchor="middle">root (clamped)</text>
<line x1="200" y1="193" x2="600" y2="262" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6 4"/>
<text font-size="12" fill="#5F5E5A" x="608" y="266">beam axis</text>
<line x1="200" y1="193" x2="330" y2="193" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/>
<path d="M300 193 A100 100 0 0 1 298.5 210" fill="none" stroke="#444441" stroke-width="1"/>
<text font-size="12" fill="#5F5E5A" x="215" y="180">Λ sweep, + aft</text>
<line x1="70" y1="230" x2="70" y2="168" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#ar)"/>
<text font-size="14" font-weight="bold" fill="#2C2C2A" x="70" y="156" text-anchor="middle">x_a forward</text>
<line x1="77" y1="230" x2="135" y2="230" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#ar)"/>
<text font-size="14" font-weight="bold" fill="#2C2C2A" x="142" y="234">y_a</text>
<circle cx="70" cy="230" r="7" fill="none" stroke="#2C2C2A" stroke-width="1"/>
<line x1="65" y1="225" x2="75" y2="235" stroke="#2C2C2A" stroke-width="1"/>
<line x1="75" y1="225" x2="65" y2="235" stroke="#2C2C2A" stroke-width="1"/>
<text font-size="12" fill="#5F5E5A" x="70" y="258" text-anchor="middle">z_a down (into page)</text>
<text font-size="12" fill="#5F5E5A" x="70" y="276" text-anchor="middle">frame a (aircraft)</text>
<line x1="406" y1="228.5" x2="469" y2="239.4" stroke="#534AB7" stroke-width="2" marker-end="url(#ar)"/>
<text font-size="14" font-weight="bold" fill="#3C3489" x="476" y="246">x_b</text>
<line x1="401.2" y1="220.6" x2="412" y2="160" stroke="#534AB7" stroke-width="2" marker-end="url(#ar)"/>
<text font-size="14" font-weight="bold" fill="#3C3489" x="420" y="152">y_b (toward LE)</text>
<circle cx="400" cy="227.5" r="7" fill="none" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="400" cy="227.5" r="2" fill="#534AB7"/>
<text font-size="12" fill="#3C3489" x="390" y="256" text-anchor="end">z_b up (out of page)</text>
<text font-size="12" fill="#3C3489" x="400" y="306" text-anchor="middle">frame b (cross-section), carried along the beam</text>
<line x1="540" y1="44" x2="540" y2="104" stroke="#378ADD" stroke-width="1.5" marker-end="url(#ar)"/>
<text font-size="12" fill="#185FA5" x="550" y="78">relative wind V∞</text>
</svg>
