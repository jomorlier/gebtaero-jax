<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Cross-section conventions: frame b, reference axis, a, nu, angle of attack</title>
<desc>Section seen looking outboard along x_b. Leading edge on the left, y_b points to the leading edge, z_b up, x_b into the page. Reference axis at a semi-chords from mid-chord, positive aft; centre of gravity at nu aft of the reference axis; lift at the quarter chord; free stream with positive angle of attack.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="330" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#2C2C2A">Cross-section — looking outboard along x_b (leading edge on the left)</text>
<path d="M160 150 C 190 118, 300 120, 520 148 C 300 170, 190 174, 160 150 Z" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<line x1="40" y1="178" x2="130" y2="160" stroke="#378ADD" stroke-width="1.5" marker-end="url(#ar)"/>
<text font-size="12" fill="#185FA5" x="40" y="198">V∞, α &gt; 0</text>
<line x1="250" y1="126" x2="250" y2="74" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ar)"/>
<text font-size="12" fill="#0F6E56" x="242" y="72" text-anchor="end">lift at c/4</text>
<line x1="297" y1="150" x2="120" y2="150" stroke="#534AB7" stroke-width="2" marker-end="url(#ar)"/>
<text font-size="14" font-weight="bold" fill="#3C3489" x="112" y="146" text-anchor="end">y_b</text>
<line x1="304" y1="143" x2="304" y2="68" stroke="#534AB7" stroke-width="2" marker-end="url(#ar)"/>
<text font-size="14" font-weight="bold" fill="#3C3489" x="312" y="74">z_b</text>
<circle cx="304" cy="150" r="7" fill="none" stroke="#534AB7" stroke-width="1.5"/>
<line x1="299" y1="145" x2="309" y2="155" stroke="#534AB7" stroke-width="1.5"/>
<line x1="309" y1="145" x2="299" y2="155" stroke="#534AB7" stroke-width="1.5"/>
<text font-size="12" fill="#3C3489" x="304" y="200" text-anchor="middle">x_b into page (outboard), reference axis</text>
<circle cx="354" cy="150" r="4" fill="#D85A30"/>
<line x1="356" y1="146" x2="392" y2="104" stroke="#888780" stroke-width="0.6" stroke-dasharray="3 3"/>
<text font-size="12" fill="#993C1D" x="398" y="104">centre of gravity</text>
<text font-size="12" fill="#5F5E5A" x="160" y="228" text-anchor="middle">LE</text>
<text font-size="12" fill="#5F5E5A" x="528" y="232">TE</text>
<line x1="340" y1="214" x2="340" y2="292" stroke="#888780" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="304" y1="214" x2="304" y2="292" stroke="#888780" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="354" y1="214" x2="354" y2="292" stroke="#888780" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="520" y1="214" x2="520" y2="240" stroke="#888780" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="342" y1="236" x2="518" y2="236" stroke="#444441" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text font-size="12" fill="#5F5E5A" x="430" y="228" text-anchor="middle">b = semi-chord</text>
<line x1="338" y1="258" x2="306" y2="258" stroke="#444441" stroke-width="1.2" marker-end="url(#ar)"/>
<text font-size="12" fill="#5F5E5A" x="296" y="262" text-anchor="end">a·b (here a &lt; 0)</text>
<line x1="306" y1="284" x2="352" y2="284" stroke="#D85A30" stroke-width="1.2" marker-end="url(#ar)"/>
<text font-size="12" fill="#993C1D" x="362" y="288">ν (CG offset, + aft)</text>
<text font-size="12" fill="#5F5E5A" x="560" y="262">+ aft →</text>
<text font-size="12" fill="#5F5E5A" x="340" y="316" text-anchor="middle">mid-chord</text>
</svg>
